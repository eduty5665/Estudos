<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurtleTrack - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <main class="login-container">
    <img src="src/turtle.png" alt="TurtleTrack Logo" class="logo-login">
    <h1>Bem-vindo ao TurtleTrack</h1>
    <p>Controle sustentável do seu estoque</p>

    <form class="login-form" id="login-form">
      <div class="input-group">
        <input type="text" id="login-user" name="user" placeholder="Usuário" required>
      </div>
      <div class="input-group">
        <input type="password" id="login-password" name="senha" placeholder="Senha" required>
      </div>
      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <footer>🐢 TurtleTrack © 2025</footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
