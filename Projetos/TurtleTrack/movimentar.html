<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimentar Produto - TurtleTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
  <header class="header">
    <a class="brand" href="menu.html">
      <img src="src/turtle.png" alt="TurtleTrack Logo" class="logo-header">
      <span>TurtleTrack</span>
    </a>
    <nav>
      <a href="menu.html">🏠 Home</a>
      <a href="#">⚙️ Configurações</a>
      <a href="menu.html">⬅ Voltar</a>
    </nav>
  </header>

  <main class="estoque-container">
    <section class="form-card">
      <h2>📥 Movimentar Estoque</h2>
      <form id="movimentacao-form">
        <label for="produto">Produto</label>
        <select id="produto" name="produto" required>
          <option value="">Selecione o produto...</option>
        </select>

        <label for="tipo">Tipo de Movimentação</label>
        <select id="tipo" name="tipo" required>
          <option value="">Selecione...</option>
          <option value="entrada">Entrada (Estoque)</option>
          <option value="saida">Saída (Loja)</option>
        </select>

        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 20" min="1" required>

        <label for="descricao">Observação (opcional)</label>
        <textarea id="descricao" name="descricao" rows="3" placeholder="Ex: Reposição de estoque da loja"></textarea>

        <button type="submit">Registrar Movimentação</button>
      </form>
    </section>

    <section class="movimentos">
      <h3>📊 Histórico de Movimentações</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Produto</th>
              <th>Tipo</th>
              <th>Quantidade</th>
              <th>Observação</th>
              <th>Estoque Atual</th>
            </tr>
          </thead>
          <tbody id="movimentos-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">© 2025 TurtleTrack | Controle completo do seu fluxo</footer>
  <script src="js/app.js"></script>
</body>
</html>
