<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - TurtleTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
  <header class="header">
    <a class="brand" href="menu.html">
      <img src="src/turtle.png" alt="TurtleTrack Logo" class="logo-header">
      <span>TurtleTrack</span>
    </a>
    <nav>
      <a href="menu.html">🏠 Home</a>
      <a href="#">⚙️ Configurações</a>
      <a href="menu.html">⬅ Voltar</a>
    </nav>
  </header>

  <main class="content">
    <h2>📦 Lista de Produtos</h2>

    <input type="text" id="search" placeholder="🔍 Buscar produto..." aria-label="Buscar produto">

    <div class="table-wrap">
      <table id="tabela-produtos">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Quantidade</th>
            <th>Preço</th>
            <th>Categoria</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="produtos-body"></tbody>
      </table>
    </div>

    <div id="modal-editar" class="modal" hidden>
      <div class="modal-content">
        <h3>Editar Produto</h3>
        <form id="form-editar">
          <input type="hidden" id="edit-id" name="id">

          <label for="edit-nome">Nome:</label>
          <input type="text" id="edit-nome" name="nome" required>

          <label for="edit-quantidade">Quantidade:</label>
          <input type="number" id="edit-quantidade" name="quantidade" min="0" required>

          <label for="edit-preco">Preço:</label>
          <input type="number" step="0.01" id="edit-preco" name="preco" min="0" required>

          <label for="edit-categoria">Categoria:</label>
          <input type="text" id="edit-categoria" name="categoria">

          <button type="submit" class="btn-save">💾 Salvar</button>
          <button type="button" class="btn-cancel" id="fechar-modal">Cancelar</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">© 2025 TurtleTrack | Gerencie seu estoque com leveza</footer>
  <script src="js/app.js"></script>
</body>
</html>
