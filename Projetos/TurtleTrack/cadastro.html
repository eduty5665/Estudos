<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Produto - TurtleTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
  <header class="header">
    <a class="brand" href="menu.html">
      <img src="src/turtle.png" alt="TurtleTrack Logo" class="logo-header">
      <span>TurtleTrack</span>
    </a>
    <nav>
      <a href="menu.html">🏠 Home</a>
      <a href="menu.html">⬅ Voltar</a>
    </nav>
  </header>

  <main class="form-container">
    <form class="form-card" id="cadastro-form">
      <h2>➕ Novo Produto</h2>

      <label for="nome">Nome do Produto</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: Água Mineral 500ml" required>

      <label for="quantidade">Quantidade</label>
      <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 100" min="0" required>

      <label for="preco">Preço (R$)</label>
      <input type="number" step="0.01" id="preco" name="preco" placeholder="Ex: 3.50" min="0" required>

      <label for="categoria">Categoria</label>
      <select id="categoria" name="categoria" required>
        <option value="">Selecione...</option>
        <option value="Bebida">Bebida</option>
        <option value="Lanche">Lanche</option>
        <option value="Salgado">Salgado</option>
        <option value="Porção">Porção</option>
      </select>

      <button type="submit" class="btn-login">Cadastrar Produto</button>
    </form>
  </main>

  <footer class="footer">© 2025 TurtleTrack | Gerencie seu estoque com leveza</footer>
  <script src="js/app.js"></script>
</body>
</html>
